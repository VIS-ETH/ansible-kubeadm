- name: Add K8s GPG key
  become: true
  ansible.builtin.apt_key:
    url: "https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key"
    state: present

- name: Add APT repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"
    state: present

- name: Install packages
  become: true
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
      - containerd
    state: present
    update_cache: true

- name: Hold packages
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  with_items:
    - kubeadm
    - kubelet
    - kubectl

- name: Add required kernel modules to modules-load.d
  become: true
  ansible.builtin.copy:
    src: containerd.conf
    dest: "/etc/modules-load.d/containerd.conf"
    mode: "0644"
  notify: Reload modules

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Set sysctl
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: 1
    reload: true
    sysctl_file: /etc/sysctl.d/90-ansible-kubeadm.conf
  with_items:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Copy containerd configuration
  become: true
  ansible.builtin.copy:
    src: config.toml
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

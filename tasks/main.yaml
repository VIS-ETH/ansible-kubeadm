- name: Add K8s GPG key
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    checksum: "sha256: 7627818cf7bae52f9008c93e8b1f961f53dea11d40891778de216fb1b43be54d"
    mode: "0644"

- name: Add APT repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
    state: present

- name: Install packages
  become: true
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
      - containerd
    state: present
    update_cache: true

- name: Hold packages
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  with_items:
    - kubeadm
    - kubelet
    - kubectl

- name: Add required kernel modules to modules-load.d
  become: true
  ansible.builtin.copy:
    src: containerd.conf
    dest: "/etc/modules-load.d/containerd.conf"
    mode: "0644"
  notify: Reload modules

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Set sysctl
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: 1
    reload: true
    sysctl_file: /etc/sysctl.d/90-ansible-kubeadm.conf
  with_items:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Copy containerd configuration
  become: true
  ansible.builtin.copy:
    src: config.toml
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

- name: Copy audit policy
  become: true
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: /etc/kubernetes/audit-policy.yaml
    owner: root
    group: root
    mode: "0600"
  when: kubeadm_enable_audit

- name: Add audit arguments
  become: true
  ansible.builtin.blockinfile:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    block: "{{ item.block | indent(width=item.indent, first=True) }}"
    marker: "{{ ('# {mark} Ansible managed Kubeadm configuration (' + item.desc + ')') | indent(item.indent, first=True) }}"
    insertafter: "{{ item.insertafter }}"
    state: "{{ 'present' if kubeadm_enable_audit else 'absent' }}"
  loop:
    - block: |
          - mountPath: /etc/kubernetes/audit-policy.yaml
            name: audit
            readOnly: true
          - mountPath: /var/log/kubernetes/audit/
            name: audit-log
            readOnly: false
      insertafter: "    volumeMounts:"
      desc: "VolumeMounts"
      indent: 4
    - block: |
        - name: audit
          hostPath:
            path: /etc/kubernetes/audit-policy.yaml
            type: File

        - name: audit-log
          hostPath:
            path: /var/log/kubernetes/audit/
            type: DirectoryOrCreate
      insertafter: "  volumes:"
      indent: 2
      desc: "Volumes"
    - insertafter: >-
        (?m)spec:\n  containers:\n  - command:\n    - kube-apiserver
      block: |
        - --audit-policy-file=/etc/kubernetes/audit-policy.yaml
        - --audit-log-path=/var/log/kubernetes/audit/audit.log
        - --audit-log-maxsize=50   # Logfiles rotated when 50MB
        - --audit-log-maxbackup=5  # Write at most 5 files
        - --audit-log-maxage=10    # Keep at most 10 days
      indent: 4
      desc: "Arguments"

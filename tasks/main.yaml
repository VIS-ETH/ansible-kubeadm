- name: Add K8s GPG key
  become: True
  apt_key:
    url: "https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key"
    state: present

- name: Add APT repository
  become: True
  apt_repository:
    repo: "deb https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"
    state: present

- name: Install packages
  become: True
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
      - containerd
    state: present
    update_cache: True

- name: Hold packages
  become: True
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  with_items:
    - kubeadm
    - kubelet
    - kubectl

- name: Add required kernel modules to modules-load.d
  become: True
  copy:
    src: containerd.conf
    dest: "/etc/modules-load.d/containerd.conf"
  register: module

- name: Reload modules
  become: True
  systemd:
    name: systemd-modules-load.service
    state: restarted
    daemon_reload: True
  when: module

- name: Set sysctl
  become: True
  sysctl:
    name: "{{ item }}"
    value: 1
    reload: True
    sysctl_file: /etc/sysctl.d/90-ansible-kubeadm.conf
  with_items:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Copy containerd configuration
  become: True
  copy:
    src: config.toml
    dest: /etc/containerd/config.toml
  notify: restart containerd

